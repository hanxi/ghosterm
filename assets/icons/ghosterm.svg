<?xml version="1.0" encoding="UTF-8"?>
<!--
  Ghosterm 应用图标 · 母版（唯一事实来源）
  概念：一只简洁的白色幽灵 = ghosterm 的品牌记忆点（幽灵剪影 + 两只眼睛 + 波浪裙摆），
  置于深靛蓝渐变底上。丢掉窗口边框 / 窗点 / 深色屏幕 / 投影，只留小尺寸也认得出的剪影。
  各端图标（macOS / iOS / Android / HarmonyOS / Linux / Web / Windows）
  一律由本文件派生，禁止直接改产物；见 assets/icons/README.md 与 scripts/build-icons.sh。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Ghosterm">
  <title>Ghosterm</title>
  <desc>简洁的白色幽灵剪影：圆顶、两只眼睛、三个波浪裙摆，置于深靛蓝渐变背景上。</desc>

  <!-- BEGIN:defs -->
  <defs>
    <linearGradient id="gt-bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#232D5C"/>
      <stop offset="1" stop-color="#0A0D1C"/>
    </linearGradient>
    <radialGradient id="gt-glow" cx="0.5" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#7A88FF" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#7A88FF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7A88FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gt-body" x1="0.25" y1="0" x2="0.78" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F3F6FF"/>
      <stop offset="1" stop-color="#C6D1F2"/>
    </linearGradient>
  </defs>
  <!-- END:defs -->

  <!-- BEGIN:bg -->
  <g id="gt-bg-layer">
    <rect width="1024" height="1024" fill="url(#gt-bg)"/>
    <rect width="1024" height="1024" fill="url(#gt-glow)"/>
  </g>
  <!-- END:bg -->

  <!-- BEGIN:mark -->
  <g id="gt-mark">
    <path fill="url(#gt-body)" d="M185.4 787.1 V454.6 A326.6 326.6 0 0 1 838.6 454.6 V787.1 A108.9 108.9 0 0 1 620.9 787.1 A108.9 108.9 0 0 1 403.1 787.1 A108.9 108.9 0 0 1 185.4 787.1 Z"/>
    <circle cx="390.3" cy="383.3" r="52" fill="#1A2142"/>
    <circle cx="633.7" cy="383.3" r="52" fill="#1A2142"/>
  </g>
  <!-- END:mark -->
</svg>
