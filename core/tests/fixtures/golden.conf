Host web
  HostName 10.0.0.5
  User deploy
  Port 2222
  IdentityFile /data/golden/web_key
  IdentityFile /data/golden/shared_key

Host *.prod api
  User produser
  ServerAliveInterval 30
  ForwardAgent yes
  Compression yes

Host jumpchain
  HostName jump.internal
  ProxyJump bastion1,bastion2
  SetEnv FOO=bar
  SetEnv BAZ=qux
  LocalForward 8080 localhost:80

Host !secret *
  User fallbackuser
  IdentityFile /data/golden/default_key
