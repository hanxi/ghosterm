# macOS 打包（可复用工作流）：本地与 CI **共用同一个脚本**（scripts/package-mac.sh），
# 这里只负责「装工具链 + 构建普通终端 + 调脚本 + 传产物」。
#
# 谁来调：
#   · .github/workflows/macos-release.yml  → tag `v*` / PR / 手动（channel=release、gates=full）
#   · .github/workflows/dev-build.yml      → 每次 push main（channel=dev、gates=light）
#
# 诚实口径（AGENTS.md 铁律 #6）：
#   · 没有签名 secret 时降级 ad-hoc 并在 BUILD-INFO 里明说，不假装已签名；
#   · 包内最低系统版本会被内嵌的 Homebrew 库抬高（BUILD-INFO.txt 记真实值）；
#   · 缺工具链时显式 SKIP 或失败，不静默跳过。
name: macOS Package (reusable)

on:
  workflow_call:
    inputs:
      channel:
        description: "dev（ad-hoc，每次提交）/ release（Developer ID + 可选公证）"
        type: string
        required: false
        default: dev
      gates:
        description: "light（core + ABI + 图标）/ full（Apple 端闸门 + 全部变异验证）"
        type: string
        required: false
        default: light
      version:
        description: "版本号（留空 = 0.1.0-dev）"
        type: string
        required: false
        default: ""
      notarize:
        description: "公证（仅 channel=release 且配了公证 secret 时生效）"
        type: boolean
        required: false
        default: false
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: false
      MACOS_CERTIFICATE_PASSWORD:
        required: false
      KEYCHAIN_PASSWORD:
        required: false
      NOTARY_APPLE_ID:
        required: false
      NOTARY_TEAM_ID:
        required: false
      NOTARY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  # 临时文件一律落仓库 tmp/（AGENTS.md 环境硬约束）
  TMPDIR: ${{ github.workspace }}/tmp
  ZIG_VERSION: 0.16.0

jobs:
  # ---------------------------------------------------------------- macOS 出包
  mac-package:
    name: Package macOS app（${{ inputs.channel }}）
    runs-on: macos-15
    # full 轨要跑九份 Apple 变异 + 一份打包变异（后者自己就要出四次包）。
    # 90 分钟是加打包变异之前的上限，实测会顶到边缘。
    timeout-minutes: 120
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_NOTARIZE: ${{ inputs.notarize }}
      INPUT_CHANNEL: ${{ inputs.channel }}
    steps:
      # vendor pin 一律走 scripts/fetch-vendor-pin.sh：
      # checkout 的内置 submodule 拉取不可靠（浅克隆会把子模块落到远端分支头，实测
      # engine pin mismatch: 55ebd1bb…），而这里的缓存 key、补丁链与契约都只认钉死的 commit。
      # persist-credentials=false：跨仓库拉公开 submodule 不能用本仓库的 token header。
      - name: 检出
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # git describe 要完整历史与 tag

      - name: 取 vendor pin
        run: bash scripts/fetch-vendor-pin.sh

      - name: 备好 tmp/
        run: mkdir -p "$TMPDIR"

      - name: 环境信息
        run: |
          set -x
          sw_vers; uname -m; swift --version; xcodebuild -version; cmake --version | head -1
          git submodule status

      - name: vendor pin（做缓存 key）
        id: pin
        run: echo "value=$(git -C vendor/ghostty rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # SDK 与随包主题采用同一份普通引擎构建；缓存不包含旧 runtime。
      - name: 缓存 libghostty 终端产物
        uses: actions/cache@v4
        id: ghostty
        with:
          path: |
            build/GhosttyKit.xcframework
            tmp/ghostty-resources
          key: terminal-${{ runner.os }}-${{ steps.pin.outputs.value }}-${{ hashFiles('patches/libghostty/**', 'scripts/build-ghostty.sh', 'scripts/build-terminal-engine.py') }}

      - name: 安装依赖（librsvg / ImageMagick / bash / Pillow）
        run: |
          set -euo pipefail
          # **bash 必须在列**：macOS 自带的 /bin/bash 是 3.2，而
          # scripts/package-mac.sh 显式要求 ≥4（CI 实测红过一次：runner 的 PATH
          # 里 /bin 先命中 → 出包第一步就 fail）。装了 brew 的 bash 之后
          # /opt/homebrew/bin 在 PATH 里排在 /bin 前面，`bash …` 才是 5.x。
          # Pillow 是图标一致性校验的依赖：装在 venv 里（系统 Python 是
          # externally-managed，pip --user 会直接被拒），下一步把它放进 PATH。
          # coreutils 是给变异验证的 `gt_timeout` 用的：runner 上没有 GNU
          # `timeout`（只有 brew 的 `gtimeout`），而变异脚本要靠超时才有界——
          # CI 实测踩过「命令不存在 = 非零 = 被当成断言变红」的假牙。
          brew install librsvg imagemagick bash coreutils
          if [ "${{ inputs.gates }}" = full ]; then brew install tmux; fi
          python3 -m venv tmp/venv-icons
          tmp/venv-icons/bin/python -m pip install --quiet --upgrade pip pillow
          tmp/venv-icons/bin/python -c 'import PIL; print("Pillow", PIL.__version__)'
          bash --version | head -1

      - name: 装 zig ${{ env.ZIG_VERSION }}（仅重建引擎时）
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # libghostty 的 build.zig.zon 钉了 minimum_zig_version=0.16.0
          ARCH="$(uname -m)"   # arm64 → aarch64
          case "$ARCH" in arm64) ARCH=aarch64;; esac
          URL="https://ziglang.org/download/${ZIG_VERSION}/zig-${ARCH}-macos-${ZIG_VERSION}.tar.xz"
          echo "缺缓存 → 下载 $URL"
          mkdir -p tmp/zig "$RUNNER_TEMP/zig-dl"
          curl -fsSL -o "$RUNNER_TEMP/zig-dl/zig.tar.xz" "$URL"
          tar -xJf "$RUNNER_TEMP/zig-dl/zig.tar.xz" -C "$RUNNER_TEMP/zig-dl" --strip-components=1
          cp -R "$RUNNER_TEMP/zig-dl/." tmp/zig/
          tmp/zig/zig version

      - name: 确保 Metal toolchain（Xcode 16+ 需单独下载，仅重建引擎时）
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain 已就绪"
          else
            echo "缺 Metal toolchain → 下载（libghostty 要编译 Metal shader）"
            sudo xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: 构建 libghostty（缓存未命中时）
        run: |
          set -euo pipefail
          if [ -d build/GhosttyKit.xcframework ]; then
            echo "缓存命中，跳过 libghostty 构建"
          else
            export PATH="$PWD/tmp/zig:$PATH"
            export ZIG="$PWD/tmp/zig/zig"
            bash scripts/build-ghostty.sh
          fi
          bash scripts/gate-ghostty-patch.sh

      - name: 轻闸门（core + ABI + 图标一致性）
        run: |
          set -euo pipefail
          bash scripts/gate.sh
          # 图标一致性**不许在 CI 上 SKIP**：轻闸门的口径就包含它，缺依赖时
          # 上面那步已经把 Pillow 装进 venv 了。真跑不了要红，不能绿得没牙。
          PATH="$PWD/tmp/venv-icons/bin:$PATH" bash scripts/build-icons.sh check

      # 打包链自己的牙（内嵌依赖 / code seal / 谎报最低系统 / 随包主题 / 配色集
      # 定位 / 公证守卫）。它依赖 GhosttyKit.xcframework 与随包主题，
      # 所以排在「构建 libghostty」之后——本地一直是手工跑，
      # 从干净检出验证，不能让开发机资源掩盖缺失依赖。
      # A6 在缺随包主题时打的是 SKIP，这里一律判失败：打包轨的口径是主题必须随包。
      #
      # 排在 Apple 长闸门**之前**的理由是纯账面的：这一步 CI 上只要 ~2 分钟，
      # Apple 那一步要 ~50 分钟。前两轮 full 轨都是跑到第 50 分钟才撞出打包链
      # 的问题（一次是 unbound variable、一次是取源写死 zig-pkg），每轮白等 48 分钟。
      - name: 变异验证 macOS 打包（full）
        if: inputs.gates == 'full'
        run: |
          set -euo pipefail
          PATH="$PWD/tmp/venv-icons/bin:$PATH" \
            bash scripts/mutation-check-package-mac.sh | tee "$RUNNER_TEMP/mutation-package.log"
          if grep -q SKIP "$RUNNER_TEMP/mutation-package.log"; then
            echo "打包变异验证里出现 SKIP（干净检出上这条必须真跑）" >&2; exit 1
          fi

      # Apple 端的四层证据（绑定对拍 / 本地 PTY / SSH e2e / 终端 UX）+ 每个断言组配一份
      # 变异验证。CI 与本地跑的是同一批脚本，本地绿而 CI 红时先怀疑环境。
      # 注意：**须在 libghostty 构建之后**——apple-app-gate 依赖 xcframework。
      - name: Apple 端闸门 + 变异验证（full）
        if: inputs.gates == 'full'
        run: |
          set -euo pipefail
          # 这条 step 只在 gates=full 时跑，跑的就是「Apple 端证据真验过」——
          # 没有 swift 工具链时不许 SKIP 成绿（那样这一整步等于没跑）。
          command -v swift >/dev/null 2>&1 || {
            echo "缺 swift 工具链，无法跑 Apple 端闸门（本步不许降级为 SKIP）" >&2; exit 1; }
          bash scripts/apple-gate.sh
          bash scripts/apple-app-gate.sh
          bash scripts/terminal-gate.sh
          bash scripts/mutation-check-terminal.sh
          bash scripts/mutation-check-transport.sh
          bash scripts/mutation-check-tabs.sh
          bash scripts/mutation-check-chrome.sh
          bash scripts/mutation-check-settings.sh
          bash scripts/mutation-check-pixel.sh
          bash scripts/mutation-check-focus.sh
          bash scripts/mutation-check-split-dim.sh
          bash scripts/mutation-check-occlusion.sh
          bash scripts/mutation-check-app-update.sh
          bash scripts/mutation-check-default-entry.sh
          python3 scripts/mutation-check-ssh-auth.py
          python3 scripts/mutation-check-ssh-credentials.py
          bash scripts/mutation-check-auth.sh | tee tmp/ci-auth-mutations.log
          if grep -q SKIP tmp/ci-auth-mutations.log; then exit 1; fi
          python3 scripts/mutation-check-tmux.py
          python3 scripts/mutation-check-tmux-ui.py

      - name: 导入 Developer ID 证书（release 轨且有 secret 才做）
        if: inputs.channel == 'release'
        id: signing
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "没有 MACOS_CERTIFICATE_P12_BASE64 → 走 ad-hoc 签名（产物未签名/未公证，仅内测）"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "导入后找不到 Developer ID Application 身份" >&2; exit 1; fi
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: 配置公证凭据（release 轨、有 secret 且要求公证时）
        if: inputs.channel == 'release' && steps.signing.outputs.mode == 'developer-id' && (github.event_name == 'push' || inputs.notarize)
        id: notary
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ]; then
            echo "没有公证 secret（NOTARY_APPLE_ID/NOTARY_TEAM_ID/NOTARY_PASSWORD）→ 跳过公证"
            exit 0
          fi
          xcrun notarytool store-credentials "ghosterm-notary" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD"
          echo "profile=ghosterm-notary" >> "$GITHUB_OUTPUT"

      - name: 出包（dmg + zip + 校验和）
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
        run: |
          set -euo pipefail
          ARGS=(--out dist --build "$GITHUB_RUN_NUMBER")
          if [ -n "${INPUT_VERSION:-}" ]; then ARGS+=(--version "$INPUT_VERSION"); fi
          if [ "${INPUT_CHANNEL}" = "release" ] && [ "${SIGN_MODE:-adhoc}" = "developer-id" ]; then
            ARGS+=(--sign "$SIGN_IDENTITY")
            if [ -n "${NOTARY_PROFILE:-}" ]; then ARGS+=(--notarize "$NOTARY_PROFILE"); fi
          else
            ARGS+=(--adhoc)
          fi
          bash scripts/package-mac.sh "${ARGS[@]}"
          echo "--- BUILD-INFO ---"
          cat dist/BUILD-INFO.txt
          ls -la dist

      - name: 上传 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghosterm-macOS-${{ inputs.channel }}-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          retention-days: 1

      - name: 保存失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ inputs.channel }}-${{ github.sha }}
          path: |
            tmp/*test.log
            tmp/apple-e2e.log
            tmp/*mut*.log
            tmp/terminal-engine/build.log
            core/build/Testing/Temporary/LastTest.log
          retention-days: 1
