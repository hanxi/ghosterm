name: Android Release APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Align Gradle home with setup-java dependency caches
        run: printf 'GRADLE_USER_HOME=%s/.gradle\n' "$HOME" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts
      - name: Prepare pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/android-ci
          export TMPDIR="$PWD/tmp/android-ci"
          git submodule update --init --depth 1 vendor/ghostty
          curl --fail --location --retry 3 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o tmp/android-ci/zig.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  tmp/android-ci/zig.tar.xz' | sha256sum -c -
          tar -xJf tmp/android-ci/zig.tar.xz -C tmp/android-ci
          echo "ZIG=$PWD/tmp/android-ci/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import os, subprocess
          manager=os.path.join(os.environ['ANDROID_HOME'],'cmdline-tools/latest/bin/sdkmanager')
          subprocess.run([manager,'--licenses'],input='y\n'*100,text=True,check=True)
          subprocess.run([manager,'platform-tools','platforms;android-36','build-tools;35.0.0','ndk;28.2.13676358','cmake;3.22.1'],check=True)
          PY
      - name: Check Android platform APIs
        run: bash scripts/check-android-api.sh
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          value=os.environ['KEYSTORE']
          if not value: raise SystemExit('Missing ANDROID_RELEASE_KEYSTORE_BASE64')
          path='tmp/android-ci/release.p12'
          with os.fdopen(os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'wb') as output:
              output.write(base64.b64decode(value,validate=True))
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('ANDROID_RELEASE_STORE_FILE='+os.path.abspath(path)+'\n')
          PY
      - name: Build optimized release
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: bash scripts/build-android.sh :app:assembleRelease
      - name: Check APK for build-host paths
        run: |
          set -euo pipefail
          apks=(android/app/build/outputs/apk/release/*.apk)
          test "${#apks[@]}" -eq 1
          python3 scripts/check-android-package-paths.py "${apks[0]}"
      - name: Verify signed installable APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist/android
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
          python3 scripts/check-android-build-info.py "$apk" --expect-commit "$GITHUB_SHA" --expect-state clean
          python3 scripts/mutation-check-android-build-info.py "$apk"
          cp "$apk" dist/android/Ghosterm-android-arm64-dev.apk
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          folder=pathlib.Path('dist/android'); apk=folder/'Ghosterm-android-arm64-dev.apk'
          import zipfile
          with zipfile.ZipFile(apk) as archive:
              metadata=json.loads(archive.read('assets/ghosterm-build.json'))
          if metadata['git_commit']!=os.environ['GITHUB_SHA'] or metadata['source_state']!='clean':
              raise SystemExit('APK source receipt does not match this CI checkout')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          (folder/'SHA256SUMS').write_text(digest+'  '+apk.name+'\n')
          (folder/'build-info.json').write_text(json.dumps({**metadata,'build_type':'release','abi':'arm64-v8a','min_sdk':29,'bytes':apk.stat().st_size,'sha256':digest,'r8':True,'resource_shrinking':True},indent=2)+'\n')
          print('Release APK bytes:',apk.stat().st_size)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: Ghosterm-android-release-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ghosterm-android-release-diagnostics-${{ github.sha }}
          path: |
            android/app/build/outputs/mapping/release/
            android/app/build/outputs/native-debug-symbols/release/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f tmp/android-ci/release.p12

  publish-dev:
    name: Publish Android dev Release
    needs: apk
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: dev-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@v4
        with:
          name: Ghosterm-android-release-${{ github.sha }}
          path: dist/android
      - name: Publish and verify shared dev Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/android-ci/release-assets tmp/android-ci/published
          cp dist/android/Ghosterm-android-arm64-dev.apk tmp/android-ci/release-assets/
          cp dist/android/SHA256SUMS tmp/android-ci/release-assets/android-SHA256SUMS
          cp dist/android/build-info.json tmp/android-ci/release-assets/android-build-info.json
          python3 scripts/check-android-release-assets.py tmp/android-ci/release-assets --expect-commit "$GITHUB_SHA"
          python3 scripts/mutation-check-android-release-assets.py tmp/android-ci/release-assets --expect-commit "$GITHUB_SHA"
          python3 scripts/mutation-check-dev-release-assets.py
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" > tmp/android-ci/before.json 2>tmp/android-ci/view.err; then
            if grep -qiE 'HTTP 404|Not Found' tmp/android-ci/view.err; then
              printf '{"id":null,"assets":[]}\n' > tmp/android-ci/before.json
              gh release create dev --prerelease --target "$GITHUB_SHA" --title 'Ghosterm dev' --notes '开发包按平台命名；版本、源码和校验和见各平台清单。'
            else
              cat tmp/android-ci/view.err >&2; exit 1
            fi
          fi
          gh release upload dev tmp/android-ci/release-assets/* --clobber
          gh release download dev --pattern Ghosterm-android-arm64-dev.apk --pattern android-SHA256SUMS --pattern android-build-info.json --dir tmp/android-ci/published
          python3 scripts/check-android-release-assets.py tmp/android-ci/published --expect-commit "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev" > tmp/android-ci/after.json
          python3 scripts/check-dev-release-assets.py --platform android --dist tmp/android-ci/release-assets --assets-file tmp/android-ci/after.json --before-file tmp/android-ci/before.json
