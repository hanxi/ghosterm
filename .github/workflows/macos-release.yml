# release 轨入口：tag `v*` / PR / 手动出包 → 全部复用 .github/workflows/macos-package.yml。
# 打包逻辑只有一套（scripts/package-mac.sh），这个文件只决定「哪个渠道、要不要建 Release」。
name: macOS Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apple/**"
      - "terminal/**"
      - "core/**"
      - "assets/icons/**"
      - "scripts/**"
      - "patches/**"
      - ".github/workflows/macos-release.yml"
      - ".github/workflows/macos-package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空时，草稿发行取当前提交的唯一正式标签，普通出包取 0.1.0-dev）"
        required: false
      notarize:
        description: "公证（需 Developer ID 证书 secret + 公证 secret）"
        type: boolean
        default: false
      upload_release:
        description: "同时建 GitHub Release（草稿）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preflight:
    name: 核对正式发行输入
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.inputs.outputs.version }}
      android_certificate_sha256: ${{ steps.inputs.outputs.android_certificate_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: 核对远端标签和签名配置
        id: inputs
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          MACOS_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
          MACOS_UPDATE_PRIVATE_KEY: ${{ secrets.MACOS_UPDATE_PRIVATE_KEY }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 || '15875e9401bf5be2bd1232e3989d5e5cc5382af17bbee89a1c3b1ef1e0f01a1c' }}
        run: |
          set -euo pipefail
          version="$(bash scripts/resolve-formal-release-version.sh "$REQUESTED_VERSION")"
          tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/v$version" --jq .sha)"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "远端正式标签 v$version 与本轮提交不一致" >&2
            exit 1
          fi
          missing=0
          for name in MACOS_UPDATE_PUBLIC_KEY MACOS_UPDATE_PRIVATE_KEY ANDROID_RELEASE_KEYSTORE_BASE64 \
                      ANDROID_RELEASE_STORE_PASSWORD ANDROID_RELEASE_KEY_PASSWORD ANDROID_RELEASE_KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "缺少正式发行配置 $name" >&2
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi
          if [[ ! "$ANDROID_RELEASE_CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Android 发行证书指纹必须是 64 位小写十六进制" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'android_certificate_sha256=%s\n' "$ANDROID_RELEASE_CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: 预检已启用的插件渠道
        if: vars.MACOS_PLUGIN_LUA == 'true' || vars.ANDROID_PLUGIN_LUA == 'true'
        env:
          MACOS_PLUGIN_LUA: ${{ vars.MACOS_PLUGIN_LUA }}
          MACOS_PLUGIN_CHANNEL: ${{ vars.MACOS_PLUGIN_CHANNEL }}
          MACOS_PLUGIN_CHANNEL_ROOT: ${{ vars.MACOS_PLUGIN_CHANNEL_ROOT }}
          MACOS_PLUGIN_CHANNEL_URL: ${{ vars.MACOS_PLUGIN_CHANNEL_URL }}
          ANDROID_PLUGIN_LUA: ${{ vars.ANDROID_PLUGIN_LUA }}
          ANDROID_PLUGIN_CHANNEL: ${{ vars.ANDROID_PLUGIN_CHANNEL }}
          ANDROID_PLUGIN_CHANNEL_ROOT: ${{ vars.ANDROID_PLUGIN_CHANNEL_ROOT }}
          ANDROID_PLUGIN_CHANNEL_URL: ${{ vars.ANDROID_PLUGIN_CHANNEL_URL }}
        run: |
          set -euo pipefail
          if [[ "$MACOS_PLUGIN_LUA" == true ]]; then
            bash scripts/check-plugin-channel-url.sh "$MACOS_PLUGIN_CHANNEL" \
              "$MACOS_PLUGIN_CHANNEL_ROOT" "$MACOS_PLUGIN_CHANNEL_URL"
          fi
          if [[ "$ANDROID_PLUGIN_LUA" == true ]]; then
            bash scripts/check-plugin-channel-url.sh "$ANDROID_PLUGIN_CHANNEL" \
              "$ANDROID_PLUGIN_CHANNEL_ROOT" "$ANDROID_PLUGIN_CHANNEL_URL"
          fi

  package:
    needs: preflight
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') }}
    uses: ./.github/workflows/macos-package.yml
    with:
      channel: release
      gates: full
      version: ${{ needs.preflight.outputs.version || inputs.version || '' }}
      formal_release: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.upload_release || false }}
      notarize: ${{ inputs.notarize || false }}
    secrets: inherit

  android:
    needs: preflight
    if: ${{ !cancelled() && needs.preflight.result == 'success' }}
    uses: ./.github/workflows/android-release.yml
    with:
      formal: true
      version: ${{ needs.preflight.outputs.version }}
    secrets: inherit

  release:
    name: 建 GitHub Release（草稿）
    needs: [preflight, package, android]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
    # Tag pushes and branch-based dispatches can target the same release.
    concurrency:
      group: formal-release-draft
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: 检出发行验签脚本
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 取产物
        uses: actions/download-artifact@v4
        with:
          name: Ghosterm-macOS-release-${{ github.sha }}
          path: dist

      - name: 取并复验 Android 正式包
        uses: actions/download-artifact@v4
        with:
          name: Ghosterm-android-release-${{ github.sha }}
          path: dist-android

      - name: 配置 Android 验签所需 JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android 构件验证工具
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          if [[ ! -x "$tools/aapt" || ! -x "$tools/apksigner" || ! -x "$tools/zipalign" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          test -x "$tools/aapt" && test -x "$tools/apksigner" && test -x "$tools/zipalign"
          "$tools/apksigner" version

      # BUILD-INFO.txt 里带着真实签名模式与最低系统版本，原样进正文，
      # 不额外润色（铁律 #6：不许把没做的事写成做了）。
      - name: 建草稿 Release
        env:
          FORMAL_RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          GHOSTERM_UPDATE_PUBLIC_KEY: ${{ vars.MACOS_UPDATE_PUBLIC_KEY }}
          ANDROID_RELEASE_CERT_SHA256: ${{ needs.preflight.outputs.android_certificate_sha256 }}
          MACOS_PLUGIN_LUA: ${{ vars.MACOS_PLUGIN_LUA }}
          ANDROID_PLUGIN_LUA: ${{ vars.ANDROID_PLUGIN_LUA }}
        run: |
          set -euo pipefail
          test -f dist/BUILD-INFO.txt && test -f dist/version.json
          (cd dist && sha256sum --check --strict SHA256SUMS)
          grep -Fq 'GitHub Release 采用 ad-hoc + 独立 Ed25519 更新签名' dist/BUILD-INFO.txt || {
            echo "BUILD-INFO 缺少 GitHub Release/ad-hoc 更新口径" >&2; exit 1; }
          if grep -Fq '未公证的包不能直接分发给终端用户' dist/BUILD-INFO.txt; then
            echo "BUILD-INFO 仍含过时的公证阻塞文案" >&2; exit 1
          fi
          VERSION="$(python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          value = json.loads(Path('dist/version.json').read_text())
          if value.get('channel') != 'release' or value.get('git_commit') != os.environ['GITHUB_SHA']:
              raise SystemExit('version.json 的渠道或构建提交与本轮不一致')
          version = value.get('version')
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('version.json 版本号无效')
          if version != os.environ['FORMAL_RELEASE_VERSION']:
              raise SystemExit('version.json 版本号与正式发行预检不一致')
          dist = Path('dist')
          dmgs, zips = list(dist.glob('*.dmg')), list(dist.glob('*.zip'))
          if len(dmgs) != 1 or len(zips) != 1:
              raise SystemExit('正式发布需要唯一的 DMG 和 ZIP')
          expected = {dmgs[0].name, zips[0].name, 'BUILD-INFO.txt'}
          rows = [line.split(None, 1) for line in (dist / 'SHA256SUMS').read_text().splitlines()]
          if len(rows) != len(expected) or any(len(row) != 2 for row in rows):
              raise SystemExit('SHA256SUMS 条目数量或格式不正确')
          checksums = {name: digest for digest, name in rows}
          if set(checksums) != expected or checksums != value.get('sha256'):
              raise SystemExit('SHA256SUMS 与更新清单或本轮产物不一致')
          if value.get('signature') not in {'adhoc', 'dev', 'id'} or type(value.get('notarized')) is not bool:
              raise SystemExit('version.json 的 Apple 签名状态不是可识别的真实档位')
          if not isinstance(value.get('update_signature'), str) or not value['update_signature']:
              raise SystemExit('version.json 缺少 Ed25519 更新签名')
          print(version)
          PY
          )"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF" != "refs/tags/$TAG" ]]; then
            echo "版本清单与触发标签不一致" >&2; exit 1
          fi
          TAG_COMMIT="$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)"
          if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "发布标签 $TAG 与本轮构建提交不一致" >&2; exit 1
          fi
          mv dist-android/Ghosterm-android-arm64-release.apk dist/
          mv dist-android/SHA256SUMS dist/android-SHA256SUMS
          mv dist-android/build-info.json dist/android-build-info.json
          if [[ "$MACOS_PLUGIN_LUA" == true ]]; then
            grep -Eq '^插件运行时:[[:space:]]*Lua 5[.]5[.]1$' dist/BUILD-INFO.txt || {
              echo "macOS 构件缺少已启用的 Lua 5.5.1" >&2; exit 1; }
          elif grep -q '^插件运行时:' dist/BUILD-INFO.txt; then
            echo "macOS 构件包含未启用的插件运行时" >&2
            exit 1
          fi
          android_profile=disabled
          if [[ "$ANDROID_PLUGIN_LUA" == true ]]; then android_profile=lua; fi
          python3 -B scripts/check-android-plugin-license.py dist/Ghosterm-android-arm64-release.apk --runtime "$android_profile"
          python3 -B scripts/audit-public-release.py --repository "$GH_REPO" --tag "$TAG" \
            --asset-directory dist --commit "$GITHUB_SHA" --update-public-key "$GHOSTERM_UPDATE_PUBLIC_KEY" \
            --android-build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --android-certificate-sha256 "$ANDROID_RELEASE_CERT_SHA256"
          NOTES="$(cat dist/BUILD-INFO.txt)"
          ASSETS=(dist/*.dmg dist/*.zip dist/SHA256SUMS dist/BUILD-INFO.txt dist/version.json dist/appcast.xml)
          ASSETS+=(dist/Ghosterm-android-arm64-release.apk dist/android-SHA256SUMS dist/android-build-info.json)
          mkdir -p tmp
          VERIFIED="$(mktemp -d "$PWD/tmp/formal-release-XXXXXX")"
          trap 'rm -rf -- "$VERIFIED"' EXIT
          expected=()
          downloads=()
          for asset in "${ASSETS[@]}"; do
            name="${asset##*/}"
            expected+=("$name")
            downloads+=(--pattern "$name")
          done
          if gh release view "$TAG" --json isDraft,assets > "$VERIFIED/inventory.json" 2>/dev/null; then
            if ! jq -e '.isDraft == true' "$VERIFIED/inventory.json" >/dev/null; then
              echo "发布 $TAG 已公开，拒绝覆盖资产" >&2; exit 1
            fi
            expected_json="$(jq -nc --args '$ARGS.positional' "${expected[@]}")"
            if ! jq -e --argjson expected "$expected_json" '
              (.assets | map(.name)) as $names |
              ($names | length) == ($names | unique | length) and (($names - $expected) | length) == 0
            ' "$VERIFIED/inventory.json" >/dev/null; then
              echo "草稿 $TAG 含重复或未知资产，请先检查清单" >&2; exit 1
            fi
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --verify-tag --draft --title "Ghosterm $TAG" --notes "$NOTES" "${ASSETS[@]}"
          fi
          gh release view "$TAG" --json isDraft,assets,body > "$VERIFIED/inventory.json"
          jq -e --arg notes "$NOTES" '.isDraft == true and .body == $notes' \
            "$VERIFIED/inventory.json" >/dev/null
          diff -u <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) \
            <(jq -r '.assets[].name' "$VERIFIED/inventory.json" | LC_ALL=C sort)
          gh release download "$TAG" --dir "$VERIFIED" "${downloads[@]}"
          for asset in "${ASSETS[@]}"; do
            cmp "$asset" "$VERIFIED/${asset##*/}"
          done
