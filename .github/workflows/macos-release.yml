# release 轨入口：tag `v*` / PR / 手动出包 → 全部复用 .github/workflows/macos-package.yml。
# 打包逻辑只有一套（scripts/package-mac.sh），这个文件只决定「哪个渠道、要不要建 Release」。
name: macOS Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apple/**"
      - "terminal/**"
      - "core/**"
      - "assets/icons/**"
      - "scripts/**"
      - "patches/**"
      - ".github/workflows/macos-release.yml"
      - ".github/workflows/macos-package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空 = 0.1.0-dev）"
        required: false
      notarize:
        description: "公证（需 Developer ID 证书 secret + 公证 secret）"
        type: boolean
        default: false
      upload_release:
        description: "同时建 GitHub Release（草稿）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  package:
    uses: ./.github/workflows/macos-package.yml
    with:
      channel: release
      gates: full
      # tag push 不传版本号：让 package-mac.sh 用 git describe 自己认（它会剥掉前导 v，
      # 且只认版本形态的 tag）；手动 dispatch 才显式指定。
      version: ${{ inputs.version }}
      notarize: ${{ inputs.notarize || false }}
    secrets: inherit

  release:
    name: 建 GitHub Release（草稿）
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 取产物
        uses: actions/download-artifact@v4
        with:
          name: Ghosterm-macOS-release-${{ github.sha }}
          path: dist

      # BUILD-INFO.txt 里带着真实签名模式与最低系统版本，原样进正文，
      # 不额外润色（铁律 #6：不许把没做的事写成做了）。
      - name: 建草稿 Release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$(sed -n 's/^版本: *\([^ ]*\).*/\1/p' dist/BUILD-INFO.txt)" ;;
          esac
          NOTES="$(cat dist/BUILD-INFO.txt)"
          gh release create "$TAG" --draft --title "Ghosterm $TAG" --notes "$NOTES" \
            dist/*.dmg dist/*.zip dist/SHA256SUMS \
          || gh release upload "$TAG" --clobber dist/*.dmg dist/*.zip dist/SHA256SUMS
