# macOS 打包。本地与 CI **共用同一个脚本**（scripts/package-mac.sh），
# 不维护第二套打包逻辑；CI 只是把「装工具链 + 调脚本 + 上传产物」串起来。
#
# 触发：
#   · push tag `v*`     → 出包 + 建 GitHub Release（草稿）
#   · workflow_dispatch → 手动出包（可选 Developer ID 签名 / 公证）
#   · pull_request      → 只验证「能出包 + 自包含断言过」，产物传成 artifact
#
# 诚实口径（AGENTS.md 铁律 #6）：
#   · 没有签名 secret 时**降级为 ad-hoc 并在 summary 里明说**，不假装已签名；
#   · 当前包的最低系统版本会被内嵌的 Homebrew 库抬高（package-mac.sh 会告警，
#     BUILD-INFO.txt 里记着真实值），这是已知遗留，不是 CI 问题；
#   · 缺工具链（zig/Metal/rsvg）时显式 SKIP 或失败，不静默跳过。
name: macOS Package

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "apple/**"
      - "terminal/**"
      - "core/**"
      - "assets/icons/**"
      - "scripts/**"
      - "patches/**"
      - ".github/workflows/macos-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空 = 最近 vX.Y.Z tag / 0.1.0-dev）"
        required: false
      notarize:
        description: "公证（需 Developer ID 证书 secret + 公证 secret）"
        type: boolean
        default: false
      upload_release:
        description: "同时建 GitHub Release（草稿）"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 临时文件一律落仓库 tmp/（AGENTS.md 环境硬约束）
  TMPDIR: ${{ github.workspace }}/tmp

jobs:
  package:
    name: Package macOS app
    runs-on: macos-15
    timeout-minutes: 90
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_NOTARIZE: ${{ inputs.notarize }}
      INPUT_RELEASE: ${{ inputs.upload_release }}
    steps:
      - name: 检出（含 submodule：libghostty 来自 vendor/ghostty）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # git describe 要完整历史

      - name: 备好 tmp/
        run: mkdir -p "$TMPDIR"

      - name: 环境信息
        run: |
          set -x
          sw_vers; uname -m; swift --version; xcodebuild -version; cmake --version | head -1
          git submodule status

      - name: 安装依赖（zig 0.16.0 / librsvg / ImageMagick）
        run: |
          set -euo pipefail
          brew install librsvg imagemagick
          if ! command -v zig >/dev/null 2>&1 || [ "$(zig version)" != "0.16.0" ]; then
            # libghostty 的 build.zig.zon 钉了 minimum_zig_version=0.16.0
            ARCH="$(uname -m)"   # aarch64 / x86_64
            URL="https://ziglang.org/download/0.16.0/zig-${ARCH}-macos-0.16.0.tar.xz"
            echo "下载 $URL"
            curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" "$URL"
            mkdir -p "$RUNNER_TEMP/zig"
            tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
            echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          fi
          zig version

      - name: 确保 Metal toolchain（Xcode 16+ 需单独下载）
        run: |
          set -euo pipefail
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "Metal toolchain 已就绪"
          else
            echo "缺 Metal toolchain → 下载（libghostty 要编译 Metal shader）"
            sudo xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi

      - name: vendor pin（做缓存 key）
        id: pin
        run: echo "value=$(git -C vendor/ghostty rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: 缓存 GhosttyKit.xcframework
        uses: actions/cache@v4
        with:
          path: vendor/ghostty/macos/GhosttyKit.xcframework
          # key 跟着 vendor pin + 补丁走：任一变化都要重建
          key: ghostty-xcfw-${{ runner.os }}-${{ steps.pin.outputs.value }}-${{ hashFiles('patches/libghostty/**/*.patch') }}
          restore-keys: |
            ghostty-xcfw-${{ runner.os }}-${{ steps.pin.outputs.value }}-

      - name: 闸门（core + ABI + 图标一致性）
        run: |
          set -euo pipefail
          bash scripts/gate.sh
          if python3 -c 'import PIL' 2>/dev/null; then
            bash scripts/build-icons.sh check
          else
            echo "SKIP 图标一致性校验：缺 Pillow（装它：python3 -m pip install --user pillow）"
          fi

      - name: 构建 libghostty（缓存未命中时）
        run: |
          set -euo pipefail
          if [ -d vendor/ghostty/macos/GhosttyKit.xcframework ]; then
            echo "缓存命中，跳过 libghostty 构建"
          else
            bash scripts/build-ghostty.sh
          fi
          bash scripts/gate-ghostty-patch.sh

      # Apple 端的四层证据（绑定对拍 / 本地 PTY / SSH e2e / 终端 UX）+
      # 每个断言组配一份变异验证。CI 与本地跑的是同一批脚本，
      # 本地绿而 CI 红时先怀疑环境（提前把「闸门只在本地绿」这类漂移挡掉）。
      # 注意：**须在 libghostty 构建之后**——apple-app-gate 依赖 xcframework。
      - name: Apple 端闸门 + 变异验证
        run: |
          set -euo pipefail
          if ! command -v swift >/dev/null 2>&1; then
            echo "SKIP Apple 端闸门：无 swift 工具链"; exit 0
          fi
          bash scripts/apple-app-gate.sh
          bash scripts/terminal-gate.sh
          bash scripts/mutation-check-terminal.sh
          bash scripts/mutation-check-transport.sh
          bash scripts/mutation-check-tabs.sh
          bash scripts/mutation-check-chrome.sh
          bash scripts/mutation-check-settings.sh
          bash scripts/mutation-check-pixel.sh
          bash scripts/mutation-check-focus.sh
          bash scripts/mutation-check-split-dim.sh
          bash scripts/mutation-check-occlusion.sh

      - name: 导入 Developer ID 证书（有 secret 才做）
        id: signing
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "没有 MACOS_CERTIFICATE_P12_BASE64 → 走 ad-hoc 签名（产物未签名/未公证，仅内测）"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain-db"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | awk -F'"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$IDENTITY" ]; then echo "导入后找不到 Developer ID Application 身份" >&2; exit 1; fi
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: 配置公证凭据（有 secret 且要求公证时）
        id: notary
        if: steps.signing.outputs.mode == 'developer-id' && (github.event_name == 'push' || inputs.notarize)
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_ID:-}" ]; then
            echo "没有公证 secret（NOTARY_APPLE_ID/NOTARY_TEAM_ID/NOTARY_PASSWORD）→ 跳过公证"
            exit 0
          fi
          xcrun notarytool store-credentials "ghosterm-notary" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD"
          echo "profile=ghosterm-notary" >> "$GITHUB_OUTPUT"

      - name: 出包（dmg + zip + 校验和）
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_PROFILE: ${{ steps.notary.outputs.profile }}
        run: |
          set -euo pipefail
          ARGS=(--out dist)
          if [ -n "${INPUT_VERSION:-}" ]; then ARGS+=(--version "$INPUT_VERSION"); fi
          if [ "$SIGN_MODE" = "developer-id" ]; then
            ARGS+=(--sign "$SIGN_IDENTITY")
            if [ -n "${NOTARY_PROFILE:-}" ]; then ARGS+=(--notarize "$NOTARY_PROFILE"); fi
          else
            ARGS+=(--adhoc)
          fi
          bash scripts/package-mac.sh "${ARGS[@]}"
          echo "--- BUILD-INFO ---"
          cat dist/BUILD-INFO.txt
          ls -la dist

      - name: 上传 workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghosterm-macOS-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          if-no-files-found: error

      - name: 建 GitHub Release（tag 或手动勾选）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.upload_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) TAG="v$(sed -n 's/^版本: *\([^ ]*\).*/\1/p' dist/BUILD-INFO.txt)" ;;
          esac
          NOTES="$(cat dist/BUILD-INFO.txt)"
          gh release create "$TAG" --draft --title "Ghosterm $TAG" --notes "$NOTES" \
            dist/*.dmg dist/*.zip dist/SHA256SUMS \
          || gh release upload "$TAG" --clobber dist/*.dmg dist/*.zip dist/SHA256SUMS
