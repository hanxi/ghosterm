name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/gterm-plugin'
      - 'scripts/plugin_release.py'
      - 'scripts/plugin-release-crypto.mjs'
      - 'scripts/plugin-release-schemas.mjs'
      - 'scripts/check-plugin-channel-url.sh'
      - 'scripts/check-plugin-channel-directory.sh'
      - 'scripts/configure-macos-plugin-channel.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  # Finish public readback before a newer deployment can replace the policy.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - name: Verify signed plugin channel before deployment
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          CHANNEL: ${{ vars.MACOS_PLUGIN_CHANNEL }}
          CHANNEL_ROOT: ${{ vars.MACOS_PLUGIN_CHANNEL_ROOT }}
          CHANNEL_URL: ${{ vars.MACOS_PLUGIN_CHANNEL_URL }}
          ANDROID_CHANNEL: ${{ vars.ANDROID_PLUGIN_CHANNEL }}
          ANDROID_CHANNEL_ROOT: ${{ vars.ANDROID_PLUGIN_CHANNEL_ROOT }}
          ANDROID_CHANNEL_URL: ${{ vars.ANDROID_PLUGIN_CHANNEL_URL }}
        run: |
          set -euo pipefail
          directory=site/plugins
          pages_policy_url="https://${PAGES_BASE_URL#*://}"
          pages_policy_url="${pages_policy_url%/}/plugins"
          if [[ ! -e "$directory" && ! -L "$directory" ]]; then
            if [[ "${CHANNEL_URL%/}" == "$pages_policy_url" ||
                  "${ANDROID_CHANNEL_URL%/}" == "$pages_policy_url" ]]; then
              echo "Configured Pages plugin policy directory is missing: $directory" >&2
              exit 1
            fi
            exit 0
          fi
          bash scripts/check-plugin-channel-directory.sh "$directory"
          if [[ -n "$CHANNEL_URL" && "${CHANNEL_URL%/}" == "${ANDROID_CHANNEL_URL%/}" ]] &&
             [[ "$CHANNEL" != "$ANDROID_CHANNEL" || "$CHANNEL_ROOT" != "$ANDROID_CHANNEL_ROOT" ]]; then
            echo "macOS and Android must use the same channel name and public key for a shared policy URL" >&2
            exit 1
          fi
          if [[ "${ANDROID_CHANNEL_URL%/}" == "$pages_policy_url" &&
                "${CHANNEL_URL%/}" != "$pages_policy_url" ]] ||
             [[ -z "$CHANNEL" && -z "$CHANNEL_ROOT" ]]; then
            CHANNEL="$ANDROID_CHANNEL"
            CHANNEL_ROOT="$ANDROID_CHANNEL_ROOT"
          fi
          python3 -B scripts/gterm-plugin release verify-policy \
            --channel "${CHANNEL:?Missing channel name}" \
            --channel-root "${CHANNEL_ROOT:?Missing channel root}" \
            --statement "$directory/channel-policy.json" \
            --signature "$directory/channel-policy.sig" \
            --policy "$directory/policy.json"
          printf 'PAGES_PLUGIN_CHANNEL=%s\nPAGES_PLUGIN_CHANNEL_ROOT=%s\n' \
            "$CHANNEL" "$CHANNEL_ROOT" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public plugin channel after deployment
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [[ ! -d site/plugins ]]; then exit 0; fi
          case "$PAGES_URL" in
            http://*) PAGES_URL="https://${PAGES_URL#http://}" ;;
            https://*) ;;
            *) echo "Missing Pages URL" >&2; exit 1 ;;
          esac
          bash scripts/check-plugin-channel-url.sh "$PAGES_PLUGIN_CHANNEL" \
            "$PAGES_PLUGIN_CHANNEL_ROOT" "${PAGES_URL%/}/plugins/" --compare-directory site/plugins
