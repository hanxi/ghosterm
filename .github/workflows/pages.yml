name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/gterm-plugin'
      - 'scripts/plugin_release.py'
      - 'scripts/plugin-release-crypto.mjs'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed plugin channel before deployment
        env:
          CHANNEL: ${{ vars.MACOS_PLUGIN_CHANNEL }}
          CHANNEL_ROOT: ${{ vars.MACOS_PLUGIN_CHANNEL_ROOT }}
        run: |
          set -euo pipefail
          directory=site/plugins
          if [[ ! -e "$directory" && ! -L "$directory" ]]; then exit 0; fi
          [[ -d "$directory" && ! -L "$directory" ]]
          for name in channel-policy.json channel-policy.sig policy.json; do
            [[ -f "$directory/$name" && ! -L "$directory/$name" ]] || {
              echo "Missing regular plugin channel file: $name" >&2
              exit 1
            }
          done
          python3 -B scripts/gterm-plugin release verify-policy \
            --channel "${CHANNEL:?Missing channel name}" \
            --channel-root "${CHANNEL_ROOT:?Missing channel root}" \
            --statement "$directory/channel-policy.json" \
            --signature "$directory/channel-policy.sig" \
            --policy "$directory/policy.json"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public plugin channel after deployment
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          if [[ ! -d site/plugins ]]; then exit 0; fi
          case "$PAGES_URL" in
            http://*) PAGES_URL="https://${PAGES_URL#http://}" ;;
            https://*) ;;
            *) echo "Missing Pages URL" >&2; exit 1 ;;
          esac
          mkdir -p tmp
          download="$(mktemp -d "$PWD/tmp/pages-channel-XXXXXX")"
          trap 'rm -rf -- "$download"' EXIT
          for entry in channel-policy.json:65536 channel-policy.sig:64 policy.json:131072; do
            name="${entry%:*}"
            limit="${entry##*:}"
            status="$(curl --disable --silent --show-error --proto '=https' --globoff \
              --connect-timeout 10 --max-time 30 --max-filesize "$limit" \
              --output "$download/$name" --write-out '%{http_code}' \
              "${PAGES_URL%/}/plugins/$name")"
            if [[ "$status" != 200 ]]; then
              echo "Plugin channel returned HTTP $status for $name" >&2
              exit 1
            fi
            cmp "site/plugins/$name" "$download/$name"
          done
